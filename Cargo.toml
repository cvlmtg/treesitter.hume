[package]
name = "hume-grammar-build"
version = "0.1.0"
edition = "2024"

[dependencies]
cc = "1"
libloading = "0.9.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3"
toml = "1.1.8"
tree-sitter = "0.27"
tree-sitter-language = "0.1.9"

[profile.release]
lto = true
strip = true
codegen-units = 1
