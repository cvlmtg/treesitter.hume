[[language]]
name = "gjs"
scope = "source.gjs"
file-types = ["gjs"]
roots = ["package.json", "ember-cli-build.js"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
language-servers = [
    { except-features = [
        "format", "diagnostics",
    ], name = "typescript-language-server" },
    "vscode-eslint-language-server",
    "ember-language-server",
]
indent = { tab-width = 2, unit = "  " }
grammar = "glimmer-javascript"

[language.auto-pairs]
'<' = '>'
"'" = "'"
"{" = "}"
"(" = ")"
'"' = '"'
