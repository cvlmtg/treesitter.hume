[[language]]
name = "php"
scope = "source.php"
injection-regex = "php"
file-types = ["php", "inc", "php4", "php5", "phtml", "ctp"]
shebangs = ["php"]
roots = ["composer.json", "index.php"]
comment-token = "//"
block-comment-tokens = [{start = "/**", end = "*/"}, {start = "/*", end = "*/"}]
language-servers = [ "intelephense" ]
indent = { tab-width = 4, unit = "    " }
