[[language]]
name = "ini"
scope = "source.ini"
file-types = [
  "ini",
  "desktop",
  { glob = "mimeapps.list" },
  { glob = ".editorconfig" },
  { glob = ".npmrc" },
  { glob = "hgrc" },
  { glob = "npmrc" },
  { glob = "rclone.conf" },
  { glob = ".aws/config" },
  "properties",
  "cfg",
  "directory",
  { glob = ".wslconfig" },
  { glob = ".buckconfig" },
  { glob = ".buckconfig.local" },
  { glob = ".buckconfig.d/*" },
  { glob = "/etc/buckconfig" },
  { glob = "/etc/buckconfig.d/*" },
  { glob = "aerc/*.conf" }, # https://aerc-mail.org/
]
injection-regex = "ini"
comment-token = "#"
indent = { tab-width = 4, unit = "\t" }
