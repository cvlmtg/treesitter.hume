[[language]]
name = "v"
scope = "source.v"
file-types = ["v", "vv", "vsh"]
# HUME matches a shebang against the one program a `#!` line runs, and
# `#!/usr/bin/env v run` runs `v`.
shebangs = ["v"]
roots = ["v.mod"]
language-servers = [ "vlang-language-server" ]
auto-format = true
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
indent = { tab-width = 4, unit = "\t" }
