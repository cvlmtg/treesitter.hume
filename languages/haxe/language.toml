[[language]]
name = "haxe"
scope = "source.haxe"
injection-regex = "hx|haxe"
file-types = ["hx"]
roots = ["haxelib.json", "project.xml", "build.hxml"]
shebangs = []
auto-format = true
comment-tokens = ["//", "///"]
block-comment-tokens = [
  { start = "/*", end = "*/" },
  { start = "/**", end = "*/" },
]
language-servers = ["haxe-language-server"]
indent = { tab-width = 4, unit = "    " }
persistent-diagnostic-sources = ["haxe"]
