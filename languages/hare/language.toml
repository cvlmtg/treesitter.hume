[[language]]
name = "hare"
scope = "source.hare"
injection-regex = "hare"
file-types = ["ha"]
comment-token = "//"
indent = { tab-width = 8, unit = "\t" }
language-servers = [
  { except-features = [
    "code-action", "completion", "format", "inlay-hints", "rename-symbol", "workspace-symbols",
  ], name = "hare-lsp" },
]
