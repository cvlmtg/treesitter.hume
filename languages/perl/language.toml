[[language]]
name = "perl"
scope = "source.perl"
file-types =[
  "pl",
  "pm",
  "t",
  "psgi",
  "raku",
  "rakumod",
  "rakutest",
  "rakudoc",
  "nqp",
  "p6",
  "pl6",
  "pm6",
  {glob = "latexmkrc"},
  {glob = ".latexmkrc"},
]
shebangs = ["perl"]
comment-token = "#"
language-servers = [ "perlnavigator" ]
indent = { tab-width = 2, unit = "  " }
