[[language]]
name = "systemd"
scope = "source.ini"
file-types = [
  # Systemd unit files
  "service",
  "automount",
  "device",
  "mount",
  "nspawn",
  "path",
  "scope",
  "slice",
  "socket",
  "swap",
  "target",
  "timer",
  { glob = "systemd/**/*.conf" },
  # Podman quadlets
  "container",
  { glob = "containers/systemd/**/*.pod" }, # extension alone would conflict with Perl POD
  "kube",
  "network",
  "volume",
  "build",
  "image",
]
injection-regex = "systemd"
comment-token = "#"
grammar = "ini"
language-servers = ["systemd-lsp"]
