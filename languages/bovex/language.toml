[[language]]
name = "bovex"
scope = "source.bovex"
file-types = ["bovex", "bibvex"]
comment-tokens = []
block-comment-tokens = [{start = "(*", end = "*)"}, {start = "[*", end = "*]"}]
indent = {tab-width = 2, unit = "  "}
[language.auto-pairs]
'(' = ')'
'[' = ']'
'{' = '}'
'"' = '"'
'“' = '”'
'‘' = '’'
