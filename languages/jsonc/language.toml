[[language]]
name = "jsonc"
scope = "source.json"
injection-regex = "jsonc"
file-types = [
  "jsonc",
  { glob = "{t,j}sconfig.json" },
  { glob = "bun.lock" },
  { glob = ".devcontainer.json" },
  { glob = "devcontainer.json" },
  { glob = ".vscode/*.json" },
]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
grammar = "json"
language-servers = [ "vscode-json-language-server" ]
auto-format = true
indent = { tab-width = 2, unit = "  " }

# https://www.w3.org/TR/json-ld/
