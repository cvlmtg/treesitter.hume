[[language]]
name = "jjconfig"
scope = "source.jjconfig"
injection-regex = "jjconfig"
grammar = "toml"
file-types = [{ glob = "jj/config.toml" }, { glob = "jj/**/*.toml" }, { glob = ".jj/repo/*.toml" }]
comment-token = "#"
language-servers = [ "taplo", "tombi" ]
indent = { tab-width = 2, unit = "  " }
